name: Run Benchmarks (All)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-all:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Restore dependencies
        run: dotnet restore

      - name: Run benchmarks
        run: dotnet run --project benchmark/IDeepCloneable.Benchmark/IDeepCloneable.Benchmark.csproj -c Release

      - name: Move Benchmark Result
        shell: bash
        run: mv -f BenchmarkDotNet.Artifacts/results/IDeepCloneable.Benchmark.CloneBenchmarks-report-github.md benchmark/results/${{ matrix.os }}-all.md

      - name: Upload Result as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark/results/${{ matrix.os }}-all.md

  commit-results:
    needs: benchmark-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          path: benchmark/results
          pattern: benchmark-*
          merge-multiple: true

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip-ci] chore: update benchmark summary"
          branch: ${{ github.ref_name }}
